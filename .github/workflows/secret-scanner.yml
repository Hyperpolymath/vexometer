# SPDX-License-Identifier: MPL-2.0
name: Secret Scanner
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
jobs:
  scan:
# The reusable's gitleaks job requests pull-requests: write (PR summary
    # comment) and actions: read (workflow-run metadata) at job level; the
    # caller must grant at least that or the run startup-fails.
    permissions:
      contents: read
      pull-requests: write
      actions: read
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@0ef5917b3a6742dc69b6758b3e40a7beb8b97d04
    secrets: inherit
